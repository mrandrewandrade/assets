<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Two parallel loads across a direct-current source</title>
  <desc id="desc">A source labelled V sub S connects to two parallel branches. Branch one contains load R sub 1 with current I sub 1. Branch two contains a functional load R sub 2 with current I sub 2. Total current I sub T enters the junction.</desc>
  <defs>
    <style>
      .wire{fill:none;stroke:#1e2b55;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .symbol{fill:white;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font:700 30px Arial,sans-serif;fill:#1e2b55}
      .small{font:24px Arial,sans-serif;fill:#404a54}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/>
    </marker>
  </defs>
  <path class="wire" d="M160 120 H1040 M160 400 H1040"/>
  <path class="wire" d="M160 120 V205 M160 315 V400"/>
  <line class="symbol" x1="115" y1="220" x2="205" y2="220"/>
  <line class="symbol" x1="132" y1="300" x2="188" y2="300"/>
  <line class="wire" x1="160" y1="220" x2="160" y2="300"/>
  <path class="wire" d="M540 120 V205 M540 315 V400 M880 120 V190 M880 330 V400"/>
  <rect class="symbol" x="475" y="205" width="130" height="110"/>
  <rect class="symbol" x="785" y="190" width="190" height="140" rx="10"/>
  <text class="label" x="540" y="265" text-anchor="middle">R₁</text>
  <text class="label" x="880" y="252" text-anchor="middle">R₂</text>
  <text class="small" x="880" y="290" text-anchor="middle">functional load</text>
  <text class="label" x="86" y="268" text-anchor="middle">V<tspan baseline-shift="sub" font-size="20">S</tspan></text>
  <path d="M320 92 H430" fill="none" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="label" x="375" y="70" text-anchor="middle">Iₜ</text>
  <path d="M510 150 V190" fill="none" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="label" x="470" y="178" text-anchor="middle">I₁</text>
  <path d="M850 145 V180" fill="none" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="label" x="810" y="174" text-anchor="middle">I₂</text>
  <text class="small" x="540" y="455" text-anchor="middle">V₁ = V₂ = Vₜ</text>
</svg>
