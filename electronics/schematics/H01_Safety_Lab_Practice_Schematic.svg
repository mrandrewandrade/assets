<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Protected low-voltage classroom circuit</title>
  <desc id="desc">A 9 volt source feeds a 500 milliamp fuse, a normally open switch, and a 330 ohm resistor with an LED load in one series loop. Labels identify source, protection, control, conductors, and load.</desc>
  <defs>
    <style>
      .wire{fill:none;stroke:#1e2b55;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .symbol{fill:none;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font:700 27px Arial,sans-serif;fill:#1e2b55}
      .small{font:22px Arial,sans-serif;fill:#404a54}
      .tag{fill:#eef2f5;stroke:#1769aa;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/>
    </marker>
  </defs>
  <path class="wire" d="M140 245 V90 H1030 V245 H920"/>
  <path class="wire" d="M780 245 H620 M500 245 H395 M265 245 H140"/>
  <line class="symbol" x1="100" y1="215" x2="180" y2="215"/>
  <line class="symbol" x1="116" y1="245" x2="164" y2="245"/>
  <line class="symbol" x1="140" y1="215" x2="140" y2="245"/>
  <rect class="symbol" x="265" y="220" width="130" height="50" rx="5"/>
  <path class="symbol" d="M500 245 H535 M605 245 H620 M535 245 L595 205"/>
  <circle class="symbol" cx="850" cy="245" r="70"/>
  <path class="symbol" d="M820 215 L880 275 M880 215 L820 275"/>
  <rect class="symbol" x="680" y="220" width="100" height="50"/>
  <path d="M885 190 l45 -35 M905 210 l45 -35" fill="none" stroke="#1769aa" stroke-width="5" marker-end="url(#arrow)"/>
  <rect class="tag" x="46" y="305" width="190" height="78" rx="10"/>
  <text class="label" x="141" y="337" text-anchor="middle">SOURCE</text>
  <text class="small" x="141" y="367" text-anchor="middle">9 V battery</text>
  <rect class="tag" x="242" y="305" width="178" height="78" rx="10"/>
  <text class="label" x="331" y="337" text-anchor="middle">PROTECTION</text>
  <text class="small" x="331" y="367" text-anchor="middle">500 mA fuse</text>
  <rect class="tag" x="476" y="305" width="168" height="78" rx="10"/>
  <text class="label" x="560" y="337" text-anchor="middle">CONTROL</text>
  <text class="small" x="560" y="367" text-anchor="middle">switch</text>
  <rect class="tag" x="670" y="305" width="360" height="78" rx="10"/>
  <text class="label" x="850" y="337" text-anchor="middle">LOAD</text>
  <text class="small" x="850" y="367" text-anchor="middle">330 Ω resistor and LED</text>
  <text class="small" x="635" y="62" text-anchor="middle">conductors complete the intended current path</text>
</svg>
