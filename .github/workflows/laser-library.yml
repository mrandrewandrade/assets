name: Laser fabrication library

on:
  pull_request:
    paths:
      - "laser/**"
      - ".github/workflows/laser-library.yml"
  push:
    branches: [master]
    paths:
      - "laser/**"
      - ".github/workflows/laser-library.yml"

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.2
      - run: python laser/scripts/generate_library.py
      - run: python laser/scripts/validate_library.py
      - run: python -m unittest discover -s laser/tests -p "test_*.py" -v
      - name: Verify deterministic output
        run: git diff --exit-code -- laser/generated
