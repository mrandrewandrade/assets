name: Build teaching PDFs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.15"

      - name: Build About Me PDF
        run: bash render.sh about-me

      - name: Upload generated documents
        uses: actions/upload-artifact@v4
        with:
          name: teaching-pdfs
          path: dist/
          if-no-files-found: error
