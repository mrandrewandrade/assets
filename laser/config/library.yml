library:
  id: technology-commons-laser-library
  title: Technology Commons Laser Fabrication Library
  version: 0.1.0
  generator_version: 0.1.0
  units: mm
  license: CC-BY-SA-4.0
  attribution: Technology Commons teaching materials by Andrew Andrade and contributors
  source: https://github.com/mrandrewandrade/assets
  default_material:
    name: Baltic birch plywood
    nominal: 1/4 inch
    measured_thickness_mm: 6.0
    warning: Measure every sheet; nominal 1/4 inch plywood is not necessarily 6.35 mm.
  fabrication:
    kerf_mm: 0.15
    clearance_mm: 0.15
    fit_offsets_mm: [-0.30, -0.20, -0.10, 0.00, 0.10, 0.20, 0.30]
  modular_faces_mm:
    - [100, 100]
    - [100, 150]
    - [100, 200]
    - [150, 150]
    - [150, 200]
    - [150, 300]
    - [200, 200]
    - [200, 300]
    - [300, 300]
    - [300, 450]
    - [450, 300]
  metric_sizes_mm: [3, 4, 5, 6, 8, 10, 12, 16, 20, 25, 30, 40, 50, 75, 100]
  imperial_sizes_in: [0.125, 0.1875, 0.25, 0.3125, 0.375, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]
  plate_sizes_mm:
    - [50, 50]
    - [75, 50]
    - [100, 50]
    - [100, 75]
    - [100, 100]
    - [100, 200]
    - [150, 100]
    - [200, 100]
    - [200, 150]
  hole_patterns:
    - {name: m3-four-hole, hole_mm: 3.2, spacing_x_mm: 40, spacing_y_mm: 30}
    - {name: m4-four-hole, hole_mm: 4.3, spacing_x_mm: 60, spacing_y_mm: 40}
    - {name: m5-four-hole, hole_mm: 5.3, spacing_x_mm: 80, spacing_y_mm: 50}
    - {name: fan-40mm, hole_mm: 3.2, spacing_x_mm: 32, spacing_y_mm: 32}
    - {name: fan-80mm, hole_mm: 4.3, spacing_x_mm: 71.5, spacing_y_mm: 71.5}
    - {name: fan-120mm, hole_mm: 4.3, spacing_x_mm: 105, spacing_y_mm: 105}
  holder_families:
    - {id: socket-rack, title: Socket rack, shop: auto, retention: hole-array, count: 10, diameter_mm: 18, spacing_mm: 26}
    - {id: screwdriver-rack, title: Screwdriver rack, shop: general, retention: hole-array, count: 8, diameter_mm: 12, spacing_mm: 24}
    - {id: drill-bit-rack, title: Drill-bit rack, shop: machine, retention: hole-array, count: 13, diameter_mm: 6, spacing_mm: 12}
    - {id: end-mill-rack, title: End-mill rack, shop: machine, retention: hole-array, count: 10, diameter_mm: 10, spacing_mm: 18}
    - {id: collet-rack, title: Collet rack, shop: machine, retention: hole-array, count: 8, diameter_mm: 20, spacing_mm: 28}
    - {id: wrench-rack, title: Wrench rack, shop: auto, retention: slot-comb, count: 10, diameter_mm: 8, spacing_mm: 18}
    - {id: plier-rack, title: Pliers rack, shop: auto, retention: slot-comb, count: 6, diameter_mm: 12, spacing_mm: 28}
    - {id: chisel-rack, title: Chisel rack, shop: wood, retention: slot-comb, count: 8, diameter_mm: 10, spacing_mm: 22}
    - {id: file-rack, title: File and rasp rack, shop: wood, retention: slot-comb, count: 8, diameter_mm: 12, spacing_mm: 24}
    - {id: precision-driver-rack, title: Precision-driver rack, shop: electronics, retention: hole-array, count: 12, diameter_mm: 7, spacing_mm: 14}
    - {id: tweezer-rack, title: Tweezer rack, shop: electronics, retention: slot-comb, count: 8, diameter_mm: 5, spacing_mm: 12}
    - {id: cable-comb, title: Cable comb, shop: electronics, retention: slot-comb, count: 10, diameter_mm: 6, spacing_mm: 14}
