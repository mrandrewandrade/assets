    - {id: pneumatic-fitting-rack, title: Pneumatic fitting rack, shop: auto, retention: hole-array, count: 8, diameter_mm: 13, spacing_mm: 22}
    - {id: brush-rack, title: Glue-brush rack, shop: wood, retention: hole-array, count: 6, diameter_mm: 16, spacing_mm: 26}
    - {id: test-lead-comb, title: Test-lead comb, shop: electronics, retention: slot-comb, count: 8, diameter_mm: 7, spacing_mm: 16}
