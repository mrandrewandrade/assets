review_policy:
  cultural_or_religious_content: Accurate naming, a source note, and human review are required before publication.
  indigenous_content: Do not generate sacred, clan, ceremonial, nation-specific, or restricted designs without authoritative sources and permission.
  trademarks: Do not generate official or near-copy team, school, university, or commercial logos without distribution rights.
